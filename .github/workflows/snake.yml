name: Update Profile Visuals

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["README.md", ".github/scripts/**", ".github/workflows/snake.yml"]
  pull_request:
    paths: ["README.md", ".github/scripts/**", ".github/workflows/snake.yml"]

permissions:
  contents: read

concurrency:
  group: profile-visuals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate calculations, private data handling and generated assets
        run: node --test .github/scripts/profile-stats.test.mjs

  generate:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate all profile visuals from one authenticated snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: node .github/scripts/generate-profile-stats.mjs
      - name: Validate SVG documents before publishing
        run: |
          python - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          files = list(pathlib.Path('dist').glob('*.svg'))
          assert len(files) == 12, 'Expected all twelve profile assets'
          for path in files:
              ET.parse(path)
          PY
      - name: Publish complete snapshot after successful generation
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          commit_message: "chore(profile): refresh generated visuals"
